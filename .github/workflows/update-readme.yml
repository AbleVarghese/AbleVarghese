name: Update README
on:
  schedule: [{cron: "17 6 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_readme.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          git config user.name "readme-bot" && git config user.email "actions@github.com"
          git add README.md && git diff --cached --quiet || git commit -m "chore: refresh recently-shipped section [skip ci]"
          git push
